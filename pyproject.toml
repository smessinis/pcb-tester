[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcbtester"
version = "0.1.0"
description = "Pre-production verification for KiCad boards"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-multipart>=0.0.12",
  "fpdf2>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
pcbtester = "pcbtester.cli:main"

[tool.setuptools.packages.find]
include = ["pcbtester*"]

[tool.setuptools.package-data]
pcbtester = ["static/*", "mcu/data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
